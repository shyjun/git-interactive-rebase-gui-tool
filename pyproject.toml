[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "git-interactive-rebase-gui-tool"
version = "0.1.0"
description = "A Python-based Git Interactive Rebase GUI tool"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "shyjun"},
]
dependencies = ["PySide6"]

[project.scripts]
git_interactive_rebase = "git_interactive_rebase:main"

[tool.setuptools]
py-modules = ["git_interactive_rebase"]
include-package-data = true
# BUG-14 fix: _build_version_hook.py is build-time-only; exclude it from the wheel.
exclude-package-data = {"*" = ["_build_version_hook.py"]}

[tool.setuptools.packages.find]
include = ["lib*", "assets*"]

[tool.setuptools.package-data]
assets = ["*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W"]
ignore = [
    "F401",   # unused imports (mixin re-exports)
    "F811",   # redefinition of unused name (mixin overrides)
    "F841",   # unused local variable (button refs, QApplication.instance() kept for side-effects)
    "E501",   # line too long
    "E701",   # multiple statements on one line
    "E722",   # bare except (intentional for git subprocess calls)
    "E741",   # ambiguous variable names
    "W291",   # trailing whitespace
]

[tool.ruff.lint.per-file-ignores]
"lib/app_window/__init__.py" = ["F401"]
"lib/dialogs/__init__.py" = ["F401"]
"lib/git_helpers/__init__.py" = ["F401"]
"lib/__init__.py" = ["F401"]
