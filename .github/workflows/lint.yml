name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - name: Install dependencies
        run: pip install ruff pytest PySide6
      - name: Ruff
        run: ruff check lib/
      - name: Missing imports
        run: python3 scripts/lint_imports.py
      - name: Import tests
        run: python3 -m pytest tests/test_imports.py -v
      - name: Notify failure via Pushover
        if: failure()
        continue-on-error: true
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: |
          message="Lint workflow failed for ${GITHUB_REPOSITORY} on ${GITHUB_REF_NAME}. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          curl --fail --silent --show-error \
            -F "token=${APP_TOKEN}" \
            -F "user=${PUSHOVER_USER_KEY}" \
            -F "title=GitHub Actions failed" \
            -F "message=${message}" \
            https://api.pushover.net/1/messages.json

      - name: Notify failure via ntfy
        if: failure()
        continue-on-error: true
        env:
          TOPIC: ${{ secrets.TOPIC }}
        run: |
          message="Lint workflow failed for ${GITHUB_REPOSITORY} on ${GITHUB_REF_NAME}. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          curl --fail --silent --show-error --http1.1 \
            -H "Title: GitHub Actions failed" \
            -H "Priority: high" \
            -H "Tags: warning,github" \
            -d "${message}" \
            "https://ntfy.sh/${TOPIC}"
