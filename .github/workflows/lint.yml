name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: sudo apt-get install -y libegl1 libgl1

      - name: Install dependencies
        run: pip install ruff pytest PySide6

      - name: Ruff
        run: ruff check lib/

      - name: Missing imports
        run: python3 scripts/lint_imports.py

      - name: Import tests
        run: python3 -m pytest tests/test_imports.py -v

      - name: Check forbidden words
        if: ${{ secrets.FORBIDDEN_WORDS != '' }}
        env:
          FORBIDDEN_WORDS: ${{ secrets.FORBIDDEN_WORDS }}
        run: |
          for word in $FORBIDDEN_WORDS; do
            if git log --all --format='%ae%n%ce' | grep -Fqi -- "$word"; then
              echo "ERROR: Forbidden identity detected in Git history."
              exit 1
            fi
          done

          echo "Forbidden words check passed."

      - name: Notify failure via Pushover
        if: failure()
        continue-on-error: true
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: |
          message="Lint workflow failed for ${GITHUB_REPOSITORY} on ${GITHUB_REF_NAME}. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          curl --fail --silent --show-error \
            -F "token=${APP_TOKEN}" \
            -F "user=${PUSHOVER_USER_KEY}" \
            -F "title=GitHub Actions failed" \
            -F "message=${message}" \
            https://api.pushover.net/1/messages.json

      - name: Notify failure via ntfy
        if: failure()
        continue-on-error: true
        env:
          TOPIC: ${{ secrets.TOPIC }}
        run: |
          message="Lint workflow failed for ${GITHUB_REPOSITORY} on ${GITHUB_REF_NAME}. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          curl --fail --silent --show-error --http1.1 \
            -H "Title: GitHub Actions failed" \
            -H "Priority: high" \
            -H "Tags: warning,github" \
            -d "${message}" \
            "https://ntfy.sh/${TOPIC}"
